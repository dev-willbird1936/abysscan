name: Source checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify release bytes and core logic
        run: >-
          node --test
          tests/release-integrity.test.mjs
          tests/detonation-jobs.test.mjs
          tests/detonation-ocean-state.test.mjs
          tests/detonation-bestiary.test.mjs
