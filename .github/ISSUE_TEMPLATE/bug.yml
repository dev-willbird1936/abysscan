name: Bug
description: Something on the live demo or in this repository is wrong.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems: do **not** use this form. Use [private vulnerability reporting](https://github.com/dev-willbird1936/abysscan/security/advisories/new).
        Live demo: https://demo.abysscan.com
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected. Include the URL if it is on the live site.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Short numbered steps. Do not attach malware samples.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Firefox 133 on Windows 11
